name: Release Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check modules, simulation rules and release version
        run: |
          for module in *.js; do node --experimental-default-type=module --check "$module" || exit 1; done
          node --experimental-default-type=module --test tests/*.test.mjs
          version=$(cat VERSION)
          grep -Fq ">v${version}</span>" index.html
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
      - name: Build Ubuntu .deb
        run: |
          python3 scripts/build_packages.py --target deb
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-deb
          path: dist/*.deb

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS .pkg
        run: |
          python3 scripts/build_packages.py --target macos
          pkgutil --payload-files dist/*.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: dist/*.pkg

  publish-release:
    needs: [build-ubuntu, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          (cd artifacts && sha256sum *.pkg *.deb > SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --title "Uinta Basin Air Ops Sim ${TAG}" \
              --generate-notes
          fi
